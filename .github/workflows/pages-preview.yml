name: Publish static CAREERON preview

on:
  push:
    branches:
      - kmkspu31-ops-work24-api-fixes
    paths:
      - "github-pages-preview/**"
      - ".github/workflows/pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
